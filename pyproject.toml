[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "au-casa"
version = "0.1.0"
description = "Python bindings for the au-casa Rust domain crate."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
module-name = "au_casa"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["pytest>=8"]

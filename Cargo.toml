[package]
name = "au-casa-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings (PyO3) for the au-casa CASA regulatory Rust crate."
publish = false

[lib]
name = "au_casa"
crate-type = ["cdylib", "rlib"]

[dependencies]
au-casa = { git = "https://github.com/Open-Aviation-Solutions/au-casa", branch = "main", version = "0.1.0" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
